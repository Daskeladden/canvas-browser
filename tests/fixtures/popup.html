<!doctype html>
<html>
  <head><title>canvas-browser popup fixture</title></head>
  <body>
    <!-- A button that opens a window of its own, as the buttons to sign
         in with Google and with Apple do. -->
    <p><button id="open" style="width: 300px; height: 40px"
               onclick="window.open('typing.html', 'popup', 'width=500,height=400')">
      Open a window</button></p>
  </body>
</html>
