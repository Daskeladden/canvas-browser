<!doctype html>
<html>
  <head>
    <title>canvas-browser worker fixture</title>
    <script>
      // The page has a service worker, and asks it to show a notification.
      // A page script cannot see what a worker shows.
      async function fromWorker() {
        await navigator.serviceWorker.register('worker.js');
        const registration = await navigator.serviceWorker.ready;
        registration.active.postMessage('notify');
      }
    </script>
  </head>
  <body>
    <p>A page whose service worker shows a notification.</p>
  </body>
</html>
