<!doctype html>
<html>
  <head>
    <title>canvas-browser panes fixture</title>
    <style>
      body { margin: 0; display: flex; height: 100vh; }
      #side { width: 200px; overflow-y: auto; }
      #pane { flex: 1; overflow-y: auto; }
      #code { width: 300px; height: 50px; overflow: auto; margin: 0; }
    </style>
  </head>
  <body>
    <div id="side">
      <p>talk 1</p><p>talk 2</p><p>talk 3</p><p>talk 4</p><p>talk 5</p>
      <p>talk 6</p><p>talk 7</p><p>talk 8</p><p>talk 9</p><p>talk 10</p>
      <p>talk 11</p><p>talk 12</p><p>talk 13</p><p>talk 14</p><p>talk 15</p>
      <p>talk 16</p><p>talk 17</p><p>talk 18</p><p>talk 19</p><p>talk 20</p>
    </div>
    <div id="pane">
      <p>A short talk, which fits in its pane.</p>
      <pre id="code">a line of code</pre>
    </div>
  </body>
</html>
