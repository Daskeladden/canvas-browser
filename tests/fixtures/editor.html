<!doctype html>
<html>
  <head><title>canvas-browser editor fixture</title></head>
  <body>
    <!-- An editor a page builds itself, as the post form of Reddit has
         it: an element that can be edited, with a paragraph for each
         line that was typed.  It is narrow, because the page of a test
         is only 200 pixels wide. -->
    <div id="editor" contenteditable="true"
         style="width: 150px; padding: 4px; border: 1px solid #888; font: 14px sans-serif">
      <p id="one">first paragraph</p>
      <p id="two">second paragraph</p>
    </div>
  </body>
</html>
